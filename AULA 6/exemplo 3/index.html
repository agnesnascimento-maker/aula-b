<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando os estilos no Javascript</title>
    <script src="./script.js" defer></script>
</head>
<body>
     <h1 id="título">Título Principal</h1>
     <h2 id="subtítulo">Subtítulo da Página</h2>

     </p>

    <br>

    <button onclick="mudarCor()">Mudar cor do título</button>
    <button onclick="mudarFundo()">Mudar fundo do parágrafo</button>
    <button onclick="esconder()">Esconder subtítulo</button>
    
</body>
</html>
